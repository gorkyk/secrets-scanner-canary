name: canary-heartbeat

# Pushes a small, harmless commit once an hour so this repo keeps
# generating real PushEvents in the public GH Archive stream, which the
# secrets-scanner pipeline uses as a permanent, always-on liveness signal
# (canary_detected_total metric) independent of organic secret findings.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat file
        run: |
          mkdir -p heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat/last_beat.txt
          echo "run_id=${GITHUB_RUN_ID}" >> heartbeat/last_beat.txt
      - name: Commit and push
        run: |
          git config user.name "secrets-scanner-canary-bot"
          git config user.email "canary-bot@users.noreply.github.com"
          git add heartbeat/last_beat.txt
          git commit -m "canary heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push
